version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=super-secret-key-for-goodspace-ai

  dashboard:
    build: .
    command: streamlit run app/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=super-secret-key-for-goodspace-ai
    depends_on:
      - api
